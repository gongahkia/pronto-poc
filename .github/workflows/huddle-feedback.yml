name: Huddle feedback
on:
  push:
    branches: [main, 'huddle/**']
  pull_request:
jobs:
  render-image:
    if: startsWith(github.ref, 'refs/heads/huddle/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Build before any host-side Next command can create ignored generated files.
      - name: Build the Render image from a clean checkout
        run: docker build --file deploy/render-web.Dockerfile --target runner --tag pronto-render:ci .
      - name: Smoke the Render image
        run: |
          trap 'docker logs pronto-render-ci; docker rm -f pronto-render-ci' EXIT
          docker run -d --name pronto-render-ci -p 127.0.0.1:10000:10000 pronto-render:ci
          # Docker can reset the first connection before Node starts listening.
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 --connect-timeout 2 --max-time 10 http://127.0.0.1:10000/api/health
          curl --fail http://127.0.0.1:10000/login > /dev/null

  huddle-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: sudo apt-get update && sudo apt-get install -y build-essential bison flex libssl-dev pkg-config
      - uses: actions/cache@v4
        with:
          path: output/runtime/pronto-postgres-18.6-vector-0.8.7
          key: pronto-huddle-pg18.6-555610c24d53-vector0.8.7-83d673c3b287-ubuntu-24.04-${{ runner.arch }}
      - run: pnpm fixtures:huddle:postgres
      - run: pnpm test:huddle:db
      - run: pnpm test:huddle:migration
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm test:huddle:browser
      - run: pnpm test:huddle:browser:public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pronto-huddle-host
          path: |
            output/huddle-v2/checks
            output/huddle-dogfood
          if-no-files-found: ignore
