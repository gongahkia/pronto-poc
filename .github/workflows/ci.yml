name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  render-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Build before any host-side Next command can create ignored generated files.
      - name: Build the Render image from a clean checkout
        run: docker build --file deploy/render-web.Dockerfile --target runner --tag pronto-render:ci .
      - name: Smoke the Render image
        run: |
          trap 'docker logs pronto-render-ci; docker rm -f pronto-render-ci' EXIT
          docker run -d --name pronto-render-ci -p 127.0.0.1:10000:10000 pronto-render:ci
          # Docker can reset the first connection before Node starts listening.
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 --connect-timeout 2 --max-time 10 http://127.0.0.1:10000/api/health
          curl --fail http://127.0.0.1:10000/login > /dev/null

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pronto_test
          POSTGRES_USER: pronto
          POSTGRES_PASSWORD: pronto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pronto -d pronto_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_BASE_URL: http://localhost:3000
      AUTH_SECRET: ci-auth-secret-with-more-than-32-characters
      DATABASE_URL: postgres://pronto:pronto@localhost:5432/pronto_test
      PRONTO_TEST_DATABASE_URL: postgres://pronto:pronto@localhost:5432/pronto_test
      PRONTO_ENFORCE_TENANT_SQL: "1"
      PRONTO_PREFLIGHT_IGNORE_DOTENV: "1"
      PRONTO_RUN_DB_TESTS: "1"
      PRONTO_SECRETS_KEY: ci-secrets-key-with-more-than-32-characters
      PRONTO_USE_MOCK_AI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # Read the exact pnpm version from package.json's packageManager.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Both exceptions have no published fix. See docs/sprint1/technical-readiness.md.
      - run: pnpm audit --audit-level moderate --ignore CVE-2026-93687 --ignore CVE-2026-97058
      - run: PRONTO_ALLOW_TEST_DB_MARK=1 pnpm test:db:mark
      - run: pnpm migrate:test
      - run: pnpm seed:test
      - run: pnpm preflight:ci
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - name: Evaluate answer quality through the real agent path with stubbed provider HTTP
        # Sharing PostgreSQL's network namespace makes the server-side address
        # loopback too, satisfying the existing local customer-demo guard.
        run: |
          docker run --rm --network container:${{ job.services.postgres.id }} \
            -v "$GITHUB_WORKSPACE:/app" -w /app \
            -e DATABASE_URL=postgres://pronto:pronto@127.0.0.1:5432/pronto_test \
            -e PRONTO_TEST_DATABASE_URL=postgres://pronto:pronto@127.0.0.1:5432/pronto_test \
            -e GITHUB_SHA="$GITHUB_SHA" \
            node:24-bookworm-slim sh -c 'npm install --global pnpm@10.33.0 && pnpm eval'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-answer-quality
          path: output/agent-quality/*.json
          if-no-files-found: ignore
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: docker build --target runner -t pronto-runner:ci .
      - name: Smoke runner image
        run: |
          docker rm -f pronto-runner-ci >/dev/null 2>&1 || true
          docker run -d --name pronto-runner-ci -p 3000:3000 \
            -e APP_BASE_URL=http://localhost:3000 \
            -e AUTH_SECRET="$AUTH_SECRET" \
            -e DATABASE_URL="$DATABASE_URL" \
            -e PRONTO_ENFORCE_TENANT_SQL="$PRONTO_ENFORCE_TENANT_SQL" \
            -e PRONTO_SECRETS_KEY="$PRONTO_SECRETS_KEY" \
            -e PRONTO_USE_MOCK_AI="$PRONTO_USE_MOCK_AI" \
            pronto-runner:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              docker stop pronto-runner-ci
              exit 0
            fi
            sleep 2
          done
          docker logs pronto-runner-ci
          docker stop pronto-runner-ci
          exit 1
      - run: docker build --target worker -t pronto-worker:ci .
      - name: Smoke worker image
        run: |
          docker rm -f pronto-worker-ci >/dev/null 2>&1 || true
          docker run -d --name pronto-worker-ci \
            --add-host=host.docker.internal:host-gateway \
            -e AUTH_SECRET="$AUTH_SECRET" \
            -e DATABASE_URL=postgres://pronto:pronto@host.docker.internal:5432/pronto_test \
            -e PRONTO_ENFORCE_TENANT_SQL="$PRONTO_ENFORCE_TENANT_SQL" \
            -e PRONTO_SECRETS_KEY="$PRONTO_SECRETS_KEY" \
            -e PRONTO_USE_MOCK_AI="$PRONTO_USE_MOCK_AI" \
            -e PRONTO_WORKER_OUTBOX_INTERVAL_MS=1000 \
            pronto-worker:ci
          sleep 3
          docker logs pronto-worker-ci | grep '"event":"worker.started"'
          docker stop pronto-worker-ci
